name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check site JS
        run: for f in site/*.js; do node --check "$f"; done

      - name: Compile job Python
        run: python3 -m py_compile job/*.py

      - name: Python unit tests
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            python3 -m unittest discover -s tests -v
          else
            echo "No tests/test_*.py yet; skipping."
          fi

      - name: Front-end smoke tests
        run: node tests/smoke.test.js
